<!doctype html>
<html>

<head>
  <title>Cinober</title>
</head>

<body>
  <div style="font-family: Arial, sans-serif;">
    <div id="btc-price" style="margin-top: 0px; padding: 5px; background: #f5f5f5; border-radius: 8px;">
      <h2 style="margin: 0 0 10px 0;">Bitcoin Price (USD)</h2>
      <div id="price-display" style="font-size: 32px; font-weight: bold; color: #f0b90b;">Loading...</div>
      <div id="last-update" style="font-size: 12px; color: #666; margin-top: 5px;"></div>
    </div>
  </div>
  <iframe id="sofa-standings-embed-48-76980"
    src="https://widgets.sofascore.com/hr-HR/embed/tournament/48/season/76980/standings/HNL%2025%2F26?widgetTitle=HNL%2025%2F26&showCompetitionLogo=true"
    style=height:723px!important;max-width:768px!important;width:100%!important; frameborder="0"
    scrolling="no"></iframe>
  <div style="font-size:12px;font-family:Arial,sans-serif;text-align:left">
    Tablice omogućuje <a target="_blank"
      href="https://www.sofascore.com/hr/turnir/nogomet/croatia/hnl/170#id:76980">Sofascore</a>
  </div>

  <script>
    async function fetchBTCPrice() {
      try {
        const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
        const data = await response.json();
        const price = parseFloat(data.price).toLocaleString('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        document.getElementById('price-display').textContent = price;
        document.getElementById('last-update').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (error) {
        document.getElementById('price-display').textContent = 'Error loading price';
        console.error('Error fetching BTC price:', error);
      }
    }

    // Fetch price immediately
    fetchBTCPrice();

    // Update every 10 seconds
    setInterval(fetchBTCPrice, 10000);
  </script>
</body>

</html>
