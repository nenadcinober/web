<!DOCTYPE html>
<html lang="hr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinober</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
  <div class="page">
    <div class="statusbar">
      <div class="app-name">CINOBER</div>
      <span id="clock"></span>
    </div>

    <div class="tiles">
      <div class="tile tile-cyan">
        <div class="tile-value" id="sp500-value">&hellip;</div>
        <div class="tile-change" id="sp500-change"></div>
        <div class="tile-label">s&amp;p 500</div>
      </div>
      <div class="tile tile-orange">
        <div class="tile-value" id="btc-value">&hellip;</div>
        <div class="tile-change" id="btc-change"></div>
        <div class="tile-label">bitcoin</div>
      </div>
      <a class="tile tile-cobalt tile-wide" href="https://dalmatinskiportal.hr/rubrika/sport" target="_blank" rel="noopener">
        <div class="tile-value" id="hajduk-opponent">&hellip;</div>
        <div class="tile-change" id="hajduk-countdown"></div>
        <div class="tile-label">hajduk &middot; sljede&#263;a utakmica</div>
      </a>
      <div class="tile-links">
        <a href="https://slobodnadalmacija.hr/sport/hajduk" target="_blank" rel="noopener">slobodna dalmacija &middot; hajduk</a>
        <a href="https://www.threads.com/@football.meets.data" target="_blank" rel="noopener">threads &middot; football meets data</a>
      </div>
      <a class="tile tile-red tile-wide" href="https://www.ufc.com/events" target="_blank" rel="noopener">
        <div class="tile-value" id="ufc-fight">&hellip;</div>
        <div class="tile-change" id="ufc-countdown"></div>
        <div class="tile-label">ufc &middot; sljede&#263;i doga&#273;aj</div>
      </a>
    </div>

    <section class="ask">
      <h2 class="section-title">pitaj</h2>
      <form id="ask-form" autocomplete="off">
        <input id="command-input" type="text" placeholder="upi&scaron;i i pritisni enter" autofocus>
      </form>
      <div id="output"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>

</html>
