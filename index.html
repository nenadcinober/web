<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="terminal" id="terminal">
    <div id="btc-display" class="btc-line">Loading BTC Price...</div>
    <div id="hajduk-display" class="hajduk-line">Loading Hajduk Match...</div>
    <div id="output"></div>
    <div class="input-line">
      <span class="prompt">
        <span class="user">ai@cinober</span><span class="white">:</span><span class="blue">~</span><span
          class="white">$</span>
      </span>
      <div style="position: relative; width: 100%;">
        <textarea id="command-input" rows="1" autocomplete="off" autofocus></textarea>
        <div id="cursor" class="cursor-block"></div>
        <!-- Mirror div for cursor positioning -->
        <div id="cursor-mirror" class="cursor-mirror"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
